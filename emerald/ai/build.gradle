// Proposal-only AI layer. Pure Java; Gson is provided by Minecraft at runtime.
dependencies {
    api project(':simulation-core')
    compileOnly "com.google.code.gson:gson:${gson_version}"

    testImplementation "com.google.code.gson:gson:${gson_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
