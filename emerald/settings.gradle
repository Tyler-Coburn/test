pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

rootProject.name = 'emerald'

// Pure Java modules: no Minecraft on the classpath. These always build.
include 'simulation-core'
include 'ai'

// The NeoForge module needs maven.neoforged.net, Mojang's servers and the SmartBrainLib maven.
// Pass -Pemerald.coreOnly=true to build only the pure modules (e.g. in a sandbox without those hosts).
def coreOnly = providers.gradleProperty('emerald.coreOnly').getOrElse('false').toBoolean()
if (!coreOnly) {
    include 'minecraft-neoforge'
}
