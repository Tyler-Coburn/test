// Pure Java civilization simulation. Must never depend on Minecraft or NeoForge.
dependencies {
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Headless end-to-end run of the first slice: ./gradlew -Pemerald.coreOnly=true :simulation-core:sandbox [-Pseed=N]
tasks.register('sandbox', JavaExec) {
    group = 'emerald'
    description = 'Runs the first-slice village scenario without Minecraft and writes build/sandbox-report.md'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.emerald.core.sandbox.SandboxMain'
    args = [project.findProperty('seed') ?: '7', "${buildDir}/sandbox-report.md"]
}

tasks.register('benchmark', JavaExec) {
    group = 'emerald'
    description = 'Measures simulation-layer cost for 10..250 citizens'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.emerald.core.sandbox.BenchmarkMain'
}
