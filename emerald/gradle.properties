org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- Mod identity ---
mod_id=emerald
mod_name=Emerald
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=dev.emerald
mod_authors=Emerald contributors
mod_description=Persistent villager civilization: citizens observe, experiment, invent and teach.

# --- Minecraft / NeoForge ---
# neo_version follows the official MDK-1.21.1-ModDevGradle template (checked 2026-10-05); SmartBrainLib 1.16.11
# was built against 21.1.191 and allows [21.1.0,).
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.252
neo_version_range=[21.1.0,)
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# ModDevGradle 2.0.x is the 1.21.1 line; 2.0.148 was verified on plugins.gradle.org.
moddev_version=2.0.148

# --- SmartBrainLib (MPL-2.0) ---
sbl_version=1.16.11
sbl_version_range=[1.16,)

# --- Pure-module test/runtime libs (Maven Central) ---
junit_version=5.11.3
# Minecraft 1.21.1 ships Gson 2.11.0; the ai module compiles against the same version.
gson_version=2.11.0
