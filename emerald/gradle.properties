org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- Mod identity ---
mod_id=emerald
mod_name=Emerald
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=dev.emerald
mod_authors=Emerald contributors
mod_description=Persistent villager civilization: citizens observe, experiment, invent and teach.

# --- Minecraft / NeoForge ---
# Pins taken from the supplied research packs (civ-scrape-pack.md section 5, civ-source-exhaustion-pack.md section J).
# They could NOT be re-resolved from the build sandbox (maven.neoforged.net / dl.cloudsmith.io blocked).
# Re-check against https://projects.neoforged.net/neoforged/neoforge and the SmartBrainLib maven before release.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.191
neo_version_range=[21.1.0,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# ModDevGradle 2.0.x is the 1.21.1 line; 2.0.148 was verified on plugins.gradle.org.
moddev_version=2.0.148

# --- SmartBrainLib (MPL-2.0) ---
sbl_version=1.16.11
sbl_version_range=[1.16,)

# --- Pure-module test/runtime libs (Maven Central) ---
junit_version=5.11.3
# Minecraft 1.21.1 ships Gson 2.11.0; the ai module compiles against the same version.
gson_version=2.11.0
